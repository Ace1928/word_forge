name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: word-forge-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"
  WORD_FORGE_HOME: ${{ github.workspace }}/.runtime/word-forge

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development environment
        run: python -m pip install -e ".[dev,gui]"
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Lint
        run: python -m ruff check .
      - name: Type-check every Python module
        run: python -m mypy src/word_forge

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: quality
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Cache NLTK resources
        uses: actions/cache@v4
        with:
          path: ~/nltk_data
          key: nltk-${{ runner.os }}-${{ matrix.python }}-v1
      - name: Install package and test runner
        run: python -m pip install -e ".[dev,gui]"
      - name: Run test suite
        run: python -m pytest -q --tb=short

  workspace:
    name: Browser workspace
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked browser dependencies
        run: npm ci
      - name: Test browser client
        run: npm test
      - name: Rebuild bundled workspace
        run: npm run build
      - name: Verify committed assets are current
        run: git diff --exit-code -- src/word_forge/web/static

  package:
    name: Build and inspect distributions
    needs: [quality, workspace]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build tools
        run: python -m pip install build twine
      - name: Build wheel and source archive
        run: python -m build
      - name: Validate package metadata
        run: python -m twine check dist/*
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: word-forge-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14

  wheel-smoke:
    name: Wheel smoke test (${{ matrix.os }})
    needs: package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: word-forge-distributions
          path: dist
      - name: Install built wheel
        shell: bash
        run: python -m pip install dist/*.whl
      - name: Exercise installed CLI and local API
        shell: bash
        run: |
          word-forge --version
          word-forge --help
          python -m word_forge --help
          python -c "from pathlib import Path; from tempfile import TemporaryDirectory; from word_forge import Lexicon; d=TemporaryDirectory(); p=Path(d.name)/'smoke.sqlite'; lex=Lexicon(p); lex.add('portable', definition='Able to move safely.'); assert lex.get('portable').definition; assert lex.find('port'); assert lex.statistics().lexemes == 1; lex.close(); print('core smoke: ok')"
          python -c "from importlib.resources import files; page=files('word_forge.web').joinpath('static/index.html'); assert page.is_file(); assert '<!doctype html>' in page.read_text(encoding='utf-8').lower(); print('workspace assets: ok')"

  dependency-audit:
    name: Audit core dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and auditor
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pip-audit
      - name: Scan installed dependency graph
        run: python -m pip_audit
