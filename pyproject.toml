[build-system]
requires      = [ "setuptools>=77", "wheel" ]
build-backend = "setuptools.build_meta"

[project]
name = "word_forge"
version = "0.1.0"
description = "A lexical data processing and enrichment system"
readme = "README.md"
authors = [ { name = "Eidosian Forge Team" } ]
license = "MIT"
license-files = [ "LICENSE" ]
keywords = [ "lexical", "linguistics", "knowledge-graph", "nlp", "semantics" ]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    "Operating System :: OS Independent",
    "Topic :: Text Processing :: Linguistic",
]
requires-python = ">=3.10"
dependencies = [
    "nltk>=3.8.1",
    "networkx>=2.8.0",
    "numpy>=1.23.5",
]

[project.optional-dependencies]
dev = [
    "black>=24.0",
    "build>=1.2",
    "isort>=5.13",
    "mypy>=1.8",
    "pre-commit>=3.5",
    "pytest>=7.4",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]
emotion = [
    "textblob>=0.18.0",
]
lexical = [
    "rdflib>=6.0.0",
]
llm = [
    "torch>=2.1.0",
    "transformers>=4.45.0",
]
nlp = [
    "spacy>=3.7.0",
]
visualization = [
    "pyvis>=0.3.2",
    "plotly>=5.24.0",
]
vector = [
    "sentence-transformers>=2.2.2",
    "chromadb>=0.4.24",
    "faiss-cpu>=1.7.4",
]
audio = [
    "ffmpeg-python>=0.2.0",
    "openai-whisper>=20231117",
]
all = [
    "chromadb>=0.4.24",
    "faiss-cpu>=1.7.4",
    "ffmpeg-python>=0.2.0",
    "openai-whisper>=20231117",
    "plotly>=5.24.0",
    "pyvis>=0.3.2",
    "rdflib>=6.0.0",
    "sentence-transformers>=2.2.2",
    "spacy>=3.7.0",
    "textblob>=0.18.0",
    "torch>=2.1.0",
    "transformers>=4.45.0",
]

[project.urls]
Homepage = "https://github.com/Ace1928/word_forge"
Issues = "https://github.com/Ace1928/word_forge/issues"
Repository = "https://github.com/Ace1928/word_forge.git"

[tool.setuptools.packages.find]
where   = [ "src" ]
include = [ "word_forge*" ]

[tool.setuptools.package-data]
"word_forge" = [ "py.typed", "*.json", "*.jsonl", "*.ttl" ]

[project.scripts]
word_forge = "word_forge.forge:main"

[tool.black]
line-length    = 88
target-version = [ "py310" ]
extend-exclude = "^/src/old/"

[tool.isort]
profile     = "black"
line_length = 88

[tool.ruff]
line-length = 88
exclude = ["src/old"]

[tool.ruff.lint]
extend-ignore = ["E402"]

[tool.mypy]
python_version           = "3.10"
mypy_path                = "src"
explicit_package_bases   = true
warn_return_any          = true
warn_unused_configs      = true
disallow_untyped_defs    = true
disallow_incomplete_defs = true

[tool.pytest.ini_options]
testpaths    = [ "tests" ]
python_files = "test_*.py"
